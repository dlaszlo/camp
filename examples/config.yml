# A worked configuration, with three repositories.
#
# This file lives at $ENV/.camp/config.yml. It states intent, and nothing
# else: the mount plan, the exclude, the inventory and the state record
# are all derived from it.
#
# The names here are an example. Use your own.

# The one absolute path in the file. Everything else is relative to it,
# and camp resolves it once, at startup.
env: /home/you/work

# Where the composed tree appears. camp creates it if it is not there --
# git cannot record an empty directory, so a fresh clone of an environment
# never brings it. It has to be a real directory rather than a symlink,
# and empty: an overlay laid over content hides it for the whole session.
merged: shop-live

# The participants. A source addresses one of these by name.
repositories:
  - { name: workspace, path: shop-env }
  - { name: code,      path: shop }
  - { name: records,   path: shop-records }

overlayfs:
  # The development environment: read-only underneath. A list, because
  # several lowers are a later iteration -- they will be merged by camp
  # into one read-only tree, so that shadowing between them can be
  # reported by name. Exactly one entry is accepted today.
  lower: [workspace]
  # The product: on top, and the only place ordinary writes land.
  upper: code

# The only names allowed to exist in both roots. Each repository needs
# its own .gitignore, and it is a file overlap, so the composed tree
# shows the code repository's copy -- which is correct: the live tree is
# governed by the product's ignore rules, and git applies no ignore rules
# to tracked files anyway.
allow_overlap: [.gitignore]

# The environment's own programs, run before anything is composed. camp
# takes nothing from them but whether they succeeded: they check, or they
# fetch, and the first one that does not succeed refuses the composition
# with nothing mounted. They run as you -- never as root -- after camp
# holds the locks and before it derives the plan, standing in the
# directory env: names, with CAMP_ENV and CAMP_LIVE in their environment.
# Each is an argv vector executed directly: no shell, so nothing is split
# on spaces and nothing is expanded. 'camp plan' lists them and does not
# run them.
#
# Leave the key out if you have nothing to run. Uncomment to use:
#
# prepare:
#   - command: [bin/check-the-checkouts]
#     # No timeout by default -- camp is driven from a terminal by
#     # somebody who can interrupt it. This one kills the command's
#     # process group after two minutes.
#     timeout: 120

# The mount sequence. One ordered list, and its order is the mount order:
# an earlier mount's target may not lie inside a later one's, because the
# later would silently cover the earlier. Parent first, then child.
steps:
  - mount_rw:
      # Both repositories have a .git at their root -- the one overlap
      # that never goes away -- and directories merge, so without this
      # bind the two git directories would union their refs and objects,
      # and refs/heads/main could resolve to the wrong history. The bind
      # covers completely; nothing merges.
      #
      # camp never adds this on its own: a core that reaches for the name
      # .git carries git knowledge, and leaving the entry out is not a
      # hole -- .git exists in both roots, nothing would cover it, and
      # the overlap gate refuses the composition before anything mounts.
      - { source: "code/.git",         target: ".git" }

      # A third repository, writable. It is a repository of its own
      # rather than a directory in the workspace, because no writable
      # mount may source from the lower. The workspace keeps a committed,
      # empty .records/ for it to attach to -- git cannot track an empty
      # directory, so put a placeholder file in it.
      - { source: "records",           target: ".records" }

  # The dual-natured directory: what the workspace tracks stands
  # read-only as islands, and everything else -- settings.local.json,
  # worktrees, whatever the tools invent next -- lands in machine-local
  # storage underneath and survives the session.
  - mount_islands:
      - { source: "workspace/.claude", target: ".claude" }

  # The shipped generation step: reads git, produces the exclude payload
  # and the islands expansions, and binds the exclude over the composed
  # tree's copy of .git/info/exclude. The repository's own file is never
  # written. Without this step the composition has no exclude at all, and
  # 'camp plan' says so.
  #
  # It comes after the .git bind on purpose: its target lies inside .git,
  # and the other order would be refused.
  - git_exclude

# The session -- what 'camp run' and 'camp shell' start. Everything here
# configures that session and nothing configures the tree, which is why it
# has a section of its own: 'camp up' mounts the tree and exits, so it
# starts no session, applies none of this, and prints one line saying so
# rather than leaving you to guess.
#
# camp writes none of the launchers named below and knows nothing about
# ssh: it applies what this file declares, and the next program that
# disagrees with a session the same way is adapted by the same key. The
# complete OpenSSH arrangement, launchers included, is in docs/install.md
# under "ssh inside a session".
#
# Uncomment from here down and edit:
#
# session:
#   # Which uid route the namespace takes. Left out, your own uid maps to
#   # itself and the mount capability is dropped before anything runs --
#   # which is the route you want unless you know otherwise. 'uidmap' uses
#   # newuidmap and your subuid range instead, podman's keep-id shape, and
#   # needs the uidmap package installed. camp never switches between them
#   # on its own: they present different uid worlds to whatever runs
#   # inside. This line stays commented when you uncomment the rest.
#   # identity: uidmap
#
#   # The environment the workload receives, and through ordinary
#   # inheritance everything descended from it. This is not env: at the
#   # top of the file -- that names the environment *root directory*;
#   # this declares the *process environment*.
#   #
#   # $NAME and ${NAME} insert what a name held in the environment camp
#   # was started with; $$ is one literal dollar; $CAMP_LIVE is the
#   # composed tree, always camp's own value for it. There is no shell in
#   # any of this: no command substitution, no ~, no word splitting, and
#   # inserted bytes are never scanned again. A name that is not set
#   # refuses -- an absent value silently becoming empty text is how a
#   # typo comes to look applied.
#   #
#   # Names beginning CAMP_ are camp's own, and PWD is too: camp sets the
#   # workload's directory and that value together.
#   environment:
#     # git runs ssh itself, so one variable covers it -- including where
#     # no shell is started, which is the case for a program 'camp run'
#     # starts directly.
#     GIT_SSH_COMMAND: "ssh -F ${HOME}/.ssh/config"
#
#     # ssh, scp and sftp typed by hand have no option variable of their
#     # own, so the only control left is which program the name resolves
#     # to: a launcher directory this workspace owns, versioned with the
#     # environment it serves, put first on the session's PATH.
#     PATH: "$CAMP_LIVE/.workspace/bin:$PATH"
#
#     # The path as it was outside, under a name this composition chose.
#     # The launchers read it to find the real programs, so that none of
#     # them has to name a distribution's directory.
#     OUTER_PATH: "$PATH"
#
#     # A mark in the shell's prompt, so that a terminal standing in the
#     # composition looks like one. It goes here rather than in your
#     # shell's own startup file for the reason the whole file exists:
#     # camp changes nothing outside a session, and a line on your machine
#     # that switches on whether camp is running is your machine behaving
#     # differently because of camp.
#     #
#     # Why PROMPT_COMMAND and not PS1: an interactive bash reads its rc
#     # and assigns PS1 there, so a PS1 arriving in the environment is
#     # overwritten before the first prompt. PROMPT_COMMAND is a variable
#     # bash imports and runs before each prompt, and a stock bashrc does
#     # not set it. Measured on Debian's own default rc.
#     #
#     # $$ is one literal dollar: camp must not expand ${PS1}, bash must.
#     # The pattern removal is what keeps it from prefixing a prompt it
#     # already prefixed, once per prompt, for the life of the session.
#     #
#     # zsh has no PROMPT_COMMAND. A zsh composition declares its own
#     # equivalent, or leaves the prompt alone -- 'camp run' names the
#     # terminal for as long as the session runs, which needs nothing
#     # declared at all.
#     PROMPT_COMMAND: 'PS1="(camp) $${PS1#(camp) }"'
